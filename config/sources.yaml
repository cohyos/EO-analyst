# EO-Analyst source registry.
# Loaded by eoa.fetch.sources_loader into pydantic models and upserted into the `sources` DB table.
#
# Fields:
#   id            stable slug, used as the DB natural key
#   name          human-readable publication/company name
#   url           feed URL (kind: rss) or listing page URL to scrape (kind: html)
#   kind          rss | html
#   lang          en | he (primary language of the content)
#   reliability   1-5 (5 = highest-trust primary/official reporting, 1 = unverified/PR-only)
#   tags          taxonomy domain ids (config/taxonomy.yaml -> domains.<id>); broad outlets carry several
#   schedule      daily | weekly (poll cadence; actual timing driven by config.yaml schedule.*)
#   notes         free text: scope, caveats, known blockers
#   verified      true only if this exact URL was fetched during authoring and returned a parseable
#                 feed (rss) or a real, non-JS-shell HTML page with a confirmed article-link pattern (html)
#   verified_at   UTC date of the verification check above
#   list_selector / link_selector  CSS hints for kind: html sources only (used by fetch/html.py + a
#                 future scraper; sanitize/extract still runs on the linked article page)
#
# Verification method: curl with a desktop Chrome UA, checking HTTP status + content-type + a raw
# body sample, done 2026-09-04. Sources behind Cloudflare/Akamai/Incapsula bot-challenges or that
# render their article list client-side via JS returned no usable static markup; these are marked
# verified: false and kept in the registry as html placeholders (fetch/service.py will skip or
# warn on repeated failures rather than block other sources).

