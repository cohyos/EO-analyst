    # (feedparser, eoa.fetch.rss) will not parse it; (b) `kind: html`'s eoa.fetch.service._extract_links
    # only reads a matched node's `href` ATTRIBUTE (built for `<a href=...>` anchors) -- a sitemap's URL
    # lives in the `<loc>` element's TEXT content, which cssselect("loc") finds (311/311, confirmed
    # locally against a saved copy of this sitemap) but `_extract_links` currently returns as `href =
    # None` for every node, so zero links would be extracted even after just changing `url`/
    # `list_selector` here. Needs a small, additive fetcher change (a `node.text` fallback when `href`
    # is absent) plus confirming `_guarded_fetch_page` hands `_extract_links` bytes, not a str retaining
    # the `<?xml ... encoding=...?>` declaration (lxml.html.fromstring raises ValueError on that exact
    # combination -- confirmed locally; the fetcher's own try/except would silently swallow it as
    # `fetch.html_source_parse_failed` and yield 0 entries, not an error). Left `verified: false` --
    # this is a shared code path (agent/eoa/fetch/service.py) used by every `html`-kind source, so the
    # fetcher change itself belongs in its own dedicated, tested round rather than bundled into a
    # content-scope fix.
