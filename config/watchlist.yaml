# Entities to track. `aliases` are used for NER matching and search-query expansion.
#
# `strict_aliases` (round-2, 2026-09-06, judge D3 finding -- docs/qa/loop/round_0_judge.md item
# 8): a subset of `aliases` that is ALSO a generic word/program name likely to appear in unrelated
# text (e.g. BlueHalo's alias "LOCUST" collides with AeroVironment's own "Locust X3" product, and
# with the US Marine Corps' own LOCUST swarm program; "Titan" collides with the US Army's TITAN
# ground-station program awarded to Palantir/Anduril). A surface listed in `strict_aliases` must
# never, on its own, attribute a text mention to this company -- `eoa.pipeline.entity_normalize
# .find_watchlist_aliases_in_text` additionally requires the company's own canonical name (or a
# *non-strict* alias) to independently co-occur in the same text before counting the hit. Every
# entry here was audited for the same collision risk during the round-2 pass; entries not listed
# were judged low-risk (acronym-shaped or otherwise unlikely to appear as ordinary English/Hebrew
# prose) -- re-audit any new alias against this same test before adding it un-flagged.
#
# `product_aliases` (round 14, 2026-09-07, docs/qa/content_review/CR-patents.md -- patent id 64,
# CN112074705A, was attributed to Anduril purely because its search snippet named an unrelated
# component, "Lattice Semiconductor Corporation" -- "Lattice" being Anduril's own product alias):
# a subset of `aliases` that names a product/system/programme, not the company itself. Still used
# for topic/NER matching (`find_watchlist_aliases_in_text`) exactly like any other alias, but a
# `product_aliases` entry can never resolve to a patent *assignee*
# (`eoa.pipeline.entity_normalize.find_watchlist_company_names_in_text`, used only by
# `eoa.patents.scan._assignee_candidates_in_text`) -- a product name is never who owns a patent,
# regardless of whether the company's own name also happens to co-occur nearby. Every entry
# already listed under `strict_aliases` is also a `product_aliases` entry (a generic-collision
# risk and a product name usually coincide); a few more are flagged here that were low collision
# risk (so never needed `strict_aliases`) but are still plainly product/programme names, not the
# company itself.
companies:
  - { name: RTX, aliases: [Raytheon, "Raytheon Technologies", "Collins Aerospace"], country: US, focus: [airborne_pods, air_defense, c_uas, directed_energy] }
