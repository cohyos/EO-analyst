# A17/W19: seed identity-only rows for `payloads` (canonical_name/vendor_entity_name/family/
# category/image_url/spec_url/spec_source).
#
# Deliberately NO spec numbers and NO prices here -- per the user's explicit instruction, every
# spec field and every price must come from a cited source (a triaged item's verbatim text, via
# `eoa.payloads.extract.run_payload_extract`), never be invented in a seed file. This list only
# gives the system a starting set of well-known EO payload families to recognize/match against so
# the first extraction runs have somewhere to attach their findings, exactly like
# `config/watchlist.yaml` seeds known companies/programs without asserting any of their facts.
#
# W19 (docs/REVIEW_2026-09-06_evening.md, migration 0022) added `image_url`/`spec_url`/
# `spec_source` -- also identity-level, never invented: every URL below was verified reachable
# (HTTP HEAD, falling back to GET, 15s timeout, via `httpx`/`curl` with a real browser
# User-Agent) at seed-authoring time (2026-09-06). `spec_url` always points at the vendor's own
# site -- never a reseller/Wikipedia/press mirror. Entries with no verified URL keep
# `spec_url`/`spec_source` unset rather than guessing one (docs/CONVENTIONS.md rule 5).
#
# Coverage note (round 4b, W19): the task asked for "a few hundred" families from the named
# vendor list (WESCAM, FLIR, Controp, Elbit, Rafael, IAI, Safran, Hensoldt, Leonardo, Aselsan,
# Teledyne FLIR, Opgal, Thales, Lockheed Sniper ATP, Northrop LITENING, Raytheon MTS, Collins
# DB-110, Trakka, Octopus, NextVision, UAV Vision, Silent Sentinel, HGH Spynel, SCD detector
# cores, Lynred, Exosens). Every *named* family was attempted; three vendors' own sites actively
# blocked automated verification even with a real browser User-Agent and could not be added
# without violating the "every URL verified reachable" rule:
#   - Rafael (rafael.co.il): every path (incl. the bare homepage) returns HTTP 247 from a
#     JS-challenge wall (Reblaze) -- Toplite/Litening 4/Litening 5/RecceLite could not be given a
#     verified spec_url; their two pre-existing identity rows (Toplite, Litening 5) are kept
#     as-is (no spec_url).
#   - Controp (controp.com): HTTP 403 on every path tried -- T-Stamp/i-Sky/DSP/FOX kept without a
#     verified spec_url (T-Stamp and DSP-HD were already seeded identity-only; i-Sky/FOX were not
#     added as new rows at all, since even the vendor's bare domain never returned a non-error
#     status this session).
#   - Octopus (Israel): no working public domain could be found (octopus-sys.com -- 404;
#     octopus.co.il/octopus-optics.com -- did not resolve) -- not added.
# PVP Photonics likewise has no new verified URL this round (existing identity-only row kept
# unchanged). Every other named vendor/family below has a live, verified `spec_url`. This yields
# 62 identity rows this round (20 pre-existing + 42 net-new families) -- short of "a few hundred"
# because each URL was individually verified rather than assumed; `image_url` was left unset
# across the board (no vendor page tried exposed a usable `og:image`; adding an invented image
# URL would violate rule 5 more than showing the honest "not yet documented" thumbnail state).
# Extending further only requires more `add()`-style verified rows -- the seed script and schema
# already support it.
#
# Loaded by `db/seed/seed_payloads.py` (idempotent upsert by `canonical_name`, never overwrites an
# already-set vendor/family/category/image_url/spec_url/spec_source with a blank one).

