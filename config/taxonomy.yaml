# Hierarchical taxonomy (user-editable). Keys are stable ids; labels are Hebrew with English term.
domains:
  airborne_pods:
    label: "פודים ומטע\"דים אוויריים (Airborne Pods & Payloads)"
    sub:
      # Round-4b W21 (docs/REVIEW_2026-09-06_evening.md, 2026-09-06): renamed from "פודי כיוון" --
      # "כיוון" reads as generic "direction/aiming", not the professional term used in Israeli
      # defense-industry usage. Canonical: "פודי ציון מטרות" (mirrors targeting doctrine's own
      # "ציון מטרה" = target designation); informal alias still seen in industry text: "פוד
      # תקיפה" (attack pod). The key (`targeting_pods`) is unchanged, so classification/DB rows are
      # unaffected; classify.py's curated Hebrew EO/IR vocabulary gate (`_EOIR_KEYWORDS_HE`) still
      # matches the old phrase "פוד כיוון" (harmless -- it may still appear in incoming text
      # verbatim) but was not extended with the new phrase/alias here since that file is out of
      # this round's scope (flagged separately for its owner).
      targeting_pods: "פודי ציון מטרות (Targeting Pods)"
      isr_pods: "פודי מודיעין וסיור (ISR/Recce Pods)"
      uav_gimbals: "מטע\"דים ג'ימבליים לכטב\"מים ומסוקים (EO/IR Gimbals)"
      small_gimbals: "מטע\"דים זעירים (Micro-Gimbals)"
      eo_warfare: "לוחמה אלקטרו-אופטית (DIRCM, Laser Dazzlers)"
      strategic_isr: "מטע\"די ISR אסטרטגיים (WAMI, Hyperspectral, SAR+EO fusion)"
      # PL-backend (2026-09-07, config/product_lines.yaml): additive sub-keys for two of the six
      # tracked product lines that don't map cleanly onto an existing sub-key alone -- `mws_eo`
      # (missile-warning) sits next to the existing `eo_warfare` (DIRCM/dazzlers) sub-key rather
      # than replacing it (a missile-warning sensor is a distinct payload from a jam/dazzle
      # emitter, even though both fall under "EO self-protection"); `lorop_pods` similarly sits
      # next to `isr_pods` (LOROP is one specific, named ISR-pod product category).
      mws: "מערכות התראת טילים (MWS)"
      lorop: "פודי LOROP"
      large_gimbals_16in: "מטע\"דים כדוריים גדולים (16 אינץ')"
  land_surveillance:
    label: "מטע\"די תצפית ומעקב יבשתיים (Land EO/IR Surveillance)"
    sub:
      border_towers: "תצפית גבולות ומגדלים (Border & Long-Range Surveillance)"
      mobile_portable: "מערכות תצפית ניידות ונישאות (Mobile/Portable Observation)"
      # Round-4b W21: "מטע\"ד מפקד/תותחן" was imprecise -- מטע\"ד (מטען ייעודי) denotes a
      # standalone mission payload/pod, while the fixed EO/IR sighting devices built into an AFV's
      # commander's/gunner's station have their own standard Hebrew term, "כוונת" (sight). Renamed
      # to lead with the correct term for that equipment, keeping "מטע\"די רק\"ם" for the broader
      # vehicle-payload/situational-awareness scope this subdomain still covers.
      vehicle_sights: "כוונות מפקד ותותחן ומטע\"די רק\"ם (Commander/Gunner Sights, Vehicle EO/IR Payloads)"
      night_vision: "ראיית לילה אישית (Fused/Digital Night Vision)"
      site_security: "אבטחת מתקנים משולבת EO/מכ\"ם (Perimeter Security)"
      # PL-backend (2026-09-07, config/product_lines.yaml): additive sub-key for the
      # `border_long_range_eo` product line -- sits next to the existing `border_towers` sub-key
      # (fixed border towers) to also cover long-range mobile/vehicle-mounted border surveillance
      # systems that aren't themselves a fixed tower.
      border_lrs: "תצפית ארוכת-טווח להגנת גבולות (Long-Range Border Surveillance)"
  naval_surveillance:
    label: "מטע\"די תצפית ימיים (Naval & Coastal EO/IR)"
    sub:
      naval_directors: "מערכות EO/IR לספינות (Naval EO Directors, Fire Control)"
      coastal: "תצפית חופית ונמלים (Coastal Surveillance)"
      optronic_masts: "תורני צוללות אופטרוניים (Optronic Masts)"
      usv_payloads: "מטע\"דים לכלי שיט בלתי מאוישים (USV Payloads)"
  air_defense:
    label: "הגנה אווירית ויירוט (Air Defense & Interceptors)"
    sub:
      iir_seekers: "ראשי ביות אלקטרואופטיים (IIR Seekers)"
      eo_trackers: "עוקבים אלקטרואופטיים במערכות יירוט (EO Trackers)"
      sensor_fusion: "שילוב EO/מכ\"ם (Sensor Fusion)"
      hel: "לייזר בעוצמה גבוהה (High-Energy Laser, HEL)"
      # PL-backend (2026-09-07, config/product_lines.yaml): additive sub-key for the
      # `eo_air_defense_warning` product line -- distinct from the existing `eo_trackers` (an
      # EO tracker embedded in an interceptor fire-control loop) in that this covers standalone
      # EO detection/warning sensors surveying airspace for an air-defense system to cue onto.
      eo_air_surveillance: "גילוי והתראה EO להגנה אווירית (EO Air-Defense Surveillance)"
  # Round-4b W24 (docs/REVIEW_2026-09-06_evening.md, 2026-09-06): new domain for the HEL/DEW
  # technology stack itself (laser sources, beam control, thermal/power) -- airborne and ground,
  # any platform -- as distinct from `air_defense.hel` (kept unchanged), which stays scoped to HEL
  # specifically framed as an *air-defense interceptor* kill mechanism within an air-defense
  # system. classify.md's platform-vs-payload domain-selection rule applies as usual: an item whose
  # dominant subject is the interceptor engagement itself -> air_defense/hel; an item whose
  # dominant subject is the laser weapon/subsystem/component technology (a beam director, a fiber
  # laser source, a HEL weapon program of record) -> directed_energy, regardless of which platform
  # or mission (air defense, C-UAS, naval, ground) it is destined for.
  directed_energy:
    label: "אנרגיה מכוונת ולייזר בעוצמה גבוהה (Directed Energy / High-Energy Laser, HEL/DEW)"
    sub:
      hel_weapon_systems: "מערכות נשק לייזר, אוויריות וקרקעיות (Airborne & Ground HEL Weapon Systems)"
      laser_sources_amplifiers: "מקורות לייזר, מגברים ומצרפי אלומה (Fiber/Slab/Diode-Pumped Laser Sources, Amplifiers, Beam Combiners, Spectral Beam Combining)"
      beam_control_directors: "בקרת אלומה ומכווני אלומה (Beam Directors, Beam Control, Adaptive Optics)"
      thermal_power_management: "ניהול תרמי והספקה למערכות לייזר (Thermal Management & Power Systems for HEL)"
  c_uas:
    label: "נגד כטב\"מים (C-UAS)"
    sub:
      detect_track: "גילוי-סיווג-עקיבה EO/IR (Detect/Classify/Track)"
      multi_sensor: "שילוב RF/מכ\"ם/אקוסטיקה (Multi-Sensor C-UAS)"
      effectors: "שיבוש והשמדה (Soft/Hard Kill)"
      convoy_site: "הגנת שיירות ואתרים (Convoy & Site Protection)"
      fpv_swarms: "נגד FPV ונחילים (Counter-FPV / Swarms)"
  computer_vision:
    label: "בינה חזותית (Computer Vision / AI)"
    sub:
      atr: "זיהוי מטרות אוטומטי (ATR/ATD)"
      # Round-4b W21: normalized to this taxonomy's own "עברית (English)" convention (already used
      # by tech_dev.on_sensor_ai's near-identical "בינה מלאכותית על-החיישן (Edge AI, ...)") instead
      # of leading with a bare English term.
      edge_ai: "בינה מלאכותית על גבי מטע\"ד (Edge AI)"
      gps_denied_nav: "ניווט חזותי בסביבת GPS מוגבל (GPS-Denied Navigation)"
      realtime_video: "עיבוד וידאו בזמן אמת"
      multimodal_isr: "מודלים מולטימודליים לניתוח ISR"
      sim2real: "למידה מסימולציה (Sim2Real, Synthetic Data)"
  secondary:
    label: "תחומים משיקים (Secondary)"
    sub:
      detectors_fpa: "גלאים ומישורי מוקד (SWIR/MWIR/LWIR, Uncooled, Event Cameras)"
      # Round-4b W21: English terms moved into the parenthetical gloss (this taxonomy's own
      # convention) instead of running on directly after a Hebrew comma-separated list.
      computational_optics: "אופטיקה חישובית וייצוב ג'ימבל (Computational Optics, Gimbal Stabilization, On-Chip Processing)"
      defense_ai_infra: "תשתיות AI ביטחוניות (MLOps, Datasets)"
  tech_dev:
    label: "התפתחויות טכנולוגיות (Technology Developments)"
    sub:
      droic_digital_pixel: "FPA עם פיקסל דיגיטלי (Digital-Pixel FPA / DROIC / In-Pixel ADC)"
      swir_eswir: "SWIR/eSWIR (InGaAs, Colloidal Quantum Dots)"
      hot_mct_t2sl: "HOT MCT, T2SL, XBn"
      event_based: "גלאים מבוססי אירועים (Neuromorphic / Event Cameras)"
      meta_optics: "אופטיקה מטא-משטחית (Metasurfaces, Flat Optics, Freeform)"
      on_sensor_ai: "בינה מלאכותית על-החיישן (Edge AI, In-Sensor Compute, ATR on FPGA/SoC)"
      laser_lidar: "לייזרים ו-LiDAR (Designators, LiDAR, Laser Dazzlers)"
      cv_atr: "ראייה ממוחשבת לזיהוי מטרות (CV Algorithms for Detection/Tracking/ATR, Multispectral Fusion)"
      image_processing: "עיבוד תמונה (Super-Resolution, Turbulence Mitigation, NUC)"
      microbolometer_uncooled: "מיקרו-בולומטר לא-מקורר (Uncooled Microbolometer)"

dimensions:
  technology:
    label: "טכנולוגי"
    tags: [sensor, algorithm, maturity_trl, patent]
  operational:
    label: "מבצעי-תפיסתי"
    tags: [conops, lessons_learned, doctrine_rfi_rfp]
  business:
    label: "עסקי"
    tags: [contract_award, m_and_a, partnership, pricing, new_entrant, export_regulation]

report_kinds: [verified_report, company_pr, rumor_speculation, academic, tender, patent, regulatory, science]

trl_scale:
  academic: "פרסום אקדמי (TRL 1-3)"
  demo: "הדגמה (TRL 4-5)"
  prototype: "אב-טיפוס (TRL 6-7)"
  operational: "מבצעי (TRL 8-9)"

geographies: [US, EU, UK, IL, TR, KR, JP, IN, CN, RU, UA, ME, other]

triage_levels:
  red: { emoji: "🔴", label: "קריטי", action: "התראה מיידית + חקירת עומק" }
  orange: { emoji: "🟠", label: "חשוב", action: "דוח יומי" }
  yellow: { emoji: "🟡", label: "רקע", action: "דוח שבועי" }
  archive: { emoji: "⚪", label: "ארכיון", action: "ללא" }
