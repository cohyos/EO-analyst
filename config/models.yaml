# Model registry. Only Western-origin (US/EU/UK/CH/CA/IL) open-weight models are allowed.
# `origin` must be in allowed_origins; runtime refuses any model not listed here.
# Digests are pinned in models.lock (generated by `eo models lock`).
allowed_origins: [US, EU, UK, CH, CA, IL]
allowed_formats: [gguf, safetensors, onnx]

models:
  gemma4_12b:
    ollama: "gemma4:12b"
    vendor: Google
    origin: US
    license: Apache-2.0
    role_hint: resident
    est_vram_mb: 8200
    ctx_max: 262144
    capabilities: [tools, thinking, vision]
  gemma4_26b:
    ollama: "gemma4:26b"
    vendor: Google
    origin: US
    license: Apache-2.0
    role_hint: resident_candidate
    est_vram_mb: 11000        # MoE 26B-A4B; experts partially offloaded to RAM
    ctx_max: 262144
    capabilities: [tools, thinking, vision]
  gemma4_e4b:
    ollama: "gemma4:e4b"
    vendor: Google
    origin: US
    license: Apache-2.0
    role_hint: light
    est_vram_mb: 5500
    ctx_max: 131072
    capabilities: [tools, thinking, vision]
  gemma4_e2b:
    ollama: "gemma4:e2b"
    vendor: Google
    origin: US
    license: Apache-2.0
    role_hint: guard_llm
    est_vram_mb: 3500
    ctx_max: 131072
    capabilities: [tools, thinking, vision]
  dictalm3_12b:
    ollama: "hf.co/dicta-il/DictaLM-3.0-Nemotron-12B-Instruct-GGUF:Q4_K_M"
    vendor: "Dicta (base: NVIDIA Nemotron Nano V2)"
    origin: IL
    license: open-weight (verify text)
    role_hint: hebrew_editor
    est_vram_mb: 8500
    ctx_max: 65280
    capabilities: [tools]
  gpt_oss_20b:
    ollama: "gpt-oss:20b"
    vendor: OpenAI
    origin: US
    license: Apache-2.0
    role_hint: heavy_investigator
    est_vram_mb: 11000        # MXFP4 14 GB; partial offload
    ctx_max: 131072
    capabilities: [tools, thinking]
  nemotron_35_lightning:
    ollama: "nemotron-3.5-lightning:latest"
    vendor: NVIDIA
    origin: US
    license: OpenMDW-1.1
    role_hint: heavy_candidate
    est_vram_mb: 11000        # 30B-A3B; heavy offload
    ctx_max: 1048576
    capabilities: [tools, thinking]
  ministral3_14b:
    ollama: "ministral-3:14b"
    vendor: Mistral AI
    origin: EU
    license: Apache-2.0
    role_hint: resident_candidate
    est_vram_mb: 9500
    ctx_max: 131072
    capabilities: [tools, vision]
  e5_large:
    ollama: multilingual-e5-large-instruct
    vendor: Microsoft
    origin: US
    license: MIT
    role_hint: embed
    dim: 1024
    est_vram_mb: 1300
  embeddinggemma:
    ollama: embeddinggemma
    vendor: Google
    origin: US
    license: Gemma
    role_hint: embed_fallback
    dim: 768
    est_vram_mb: 900
  granite_guardian_2b:
    ollama: "granite3-guardian:2b"
    vendor: IBM
    origin: US
    license: Apache-2.0
    role_hint: guard_l2
    est_vram_mb: 2500
  prompt_injection_deberta:
