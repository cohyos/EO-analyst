# Fixed specification vocabulary for the product dossier feature (docs/PLAN_PRODUCT_DOSSIER.md,
# docs/PLAN_SPEC_VOCABULARY.md -- the design/implementation contract this file is frozen against).
#
# Problem this solves: today `eoa.dossier.extract` lets the LLM name each specification/performance
# parameter freely (`SpecRow.parameter_he` / `PerformanceRow.metric_he` are free text). Live evidence
# (product_dossiers id=1/2/3, all the same product -- Elbit SPECTRO XR, targeting_pods) shows the same
# underlying fact named three different ways across three runs:
#   id=1 performance.metric_he   = "עומס אופטי במארז קומפקטי"
#   id=2 performance.metric_he   = "עומס אופטי במארז קומפקטי" (specifications.parameter_he = "ביצועי אופטיקה")
#   id=3 specifications.parameter_he = "ביצועי עומס אופטי במארז קומפקטי"
#   id=3 performance.metric_he   = "יחס גודל-לביצועים (עומס אופטי)"
# -- one fact ("20-inch-class aperture performance inside a 15-inch envelope"), four different labels,
# split inconsistently between the specifications and performance sections. This file is the fix: a
# closed, stable `key` per parameter (never renamed), so extraction always writes to the same slot,
# diff compares by key (no fuzzy name matching needed), and the UI renders a fixed row order with
# grouped headers -- see docs/PLAN_SPEC_VOCABULARY.md lane (a)/(b)/(c). The recurring fact above maps
# onto `common.size_to_performance_ratio` (a system-level ratio) plus, for targeting pods specifically,
# `targeting_pods.pod_class_diameter` (the concrete "N-inch class" figure) -- see those two entries'
# own notes_he for how they stay distinct.
#
# --------------------------------------------------------------------------------------------------
# Structure
# --------------------------------------------------------------------------------------------------
# `common`: parameters every EO/IR payload in this catalog shares (optics/detector/stabilization/
#   mechanical/interface/laser/maturity basics) -- applies to all six product lines.
# One block per product_lines.yaml id (targeting_pods, mws_eo, lorop_pods, eo_air_defense_warning,
#   ball_gimbals_16in, border_long_range_eo): parameters SPECIFIC to that line, on top of `common`.
#   The effective vocabulary for a dossier of product_line X = common + vocabulary[X] (concatenated,
#   `common` first, in the order both appear here) -- see docs/PLAN_SPEC_VOCABULARY.md lane (a) for
#   exactly how extraction consumes this union. A dossier with no product_line set (product_line is
#   optional, section 5 of the dossier plan) falls back to `common` alone plus whatever the extractor's
#   own "other" overflow list captures (see that doc's lane (a) again).
#
# Every parameter entry:
#   key            snake_case, stable, GLOBALLY unique across common + all six line blocks (never
#                  reused for a different fact even across lines -- diff/extraction key on this alone)
#   table          "specifications" | "performance" -- which of ProductDossierOut's two existing row
#                  lists this key's extracted value lands in (added post-freeze per
#                  docs/PLAN_SPEC_VOCABULARY.md section 3.4/section 9 item 1: a measured-outcome
#                  number/range param -- claimed-vs-demonstrated is meaningful for it -- routes to
#                  "performance"; every mechanical/interface/enum/bool/identity-shaped param routes to
#                  "specifications". This is DATA, not model judgment -- eoa.dossier.extract's
#                  post-check relocates a row the model placed in the wrong table by this field alone.
#   label_he       professional Hebrew label as used by Israeli EO/IR defence engineers
#   label_en       English label (industry-standard term/acronym where one exists)
#   unit           unit of measure as a short Hebrew/English string, or null when not a measured
#                  quantity (e.g. a bool/enum/text capability)
#   value_type     number | range | text | enum | bool | list -- see docs/PLAN_SPEC_VOCABULARY.md
#                  lane (a) for how the extractor is asked to shape SpecRow.value against this
#   enum_values    list of allowed values when value_type: enum, else omitted/null
#   synonyms       Hebrew + English strings the extractor matches (case-insensitive substring for
#                  Hebrew, case-insensitive whole-word for English/acronyms -- the exact convention
#                  config/product_lines.yaml's own keywords_he/keywords_en/aliases already use, see
#                  eoa.product_lines.tagging._word_present/_matches_product_precisely for the reused
#                  matcher). No regex syntax is needed/supported here -- literal phrases only, applied
#                  through the same word-boundary-safe matching pipeline every other config/*.yaml
#                  keyword list in this repo already goes through (a future entry that genuinely needs
#                  a regex should use the "re:<pattern>" prefix convention already reserved for it, per
#                  docs/PLAN_SPEC_VOCABULARY.md lane (a) -- none of the entries below need it today).
#   group_he       one of the 8 fixed section groups (below) -- the UI groups the spec table by this.
#   required       true: the row always renders (with "לא נמצא במקורות" when unknown) even if the
#                  extraction found nothing for it; false: only renders when a value was found.
#   notes_he       what counts as grounded for this parameter; what to keep apart (claimed vs.
#                  demonstrated; target-size assumptions for DRI; per-variant values); left empty
#                  ("") only for parameters with no such caveat.
#
# group_he values (fixed, matches docs/PLAN_PRODUCT_DOSSIER.md section 6's UI grouping):
#   אופטיקה | חיישנים | לייזר | ייצוב ובקרה | מכניקה וסביבה | ממשקים | ביצועי מערכת | בשלות ולוגיסטיקה
#
# What this file does NOT do: it does not itself implement matching/extraction/UI -- see
# docs/PLAN_SPEC_VOCABULARY.md for the implementation lanes and their exact file lists.

schema_version: 1

# ====================================================================================================
# COMMON -- shared by every product line (24 parameters)
# ====================================================================================================
common:
  - key: field_of_view
    table: "specifications"
    label_he: "שדה ראייה"
    label_en: "Field of View (FOV)"
    unit: "מעלות (°) / מיליראד (mrad)"
    value_type: range
    synonyms:
      - "שדה ראייה"
      - "שדה-ראייה"
      - "FOV"
      - "field of view"
      #: PD-fix-4 (2026-09-09, item 1): the live SPECTRO XR run-8 corpus carried a per-channel
      #: "מספר שדות הראייה" (number-of-FOVs) overflow row for each of its three imaging channels --
      #: only the one row that also literally spelled out "(FOV)" already matched via the synonym
      #: above; the other two used the definite-article form "שדות הראייה" (no exact substring match
      #: against the existing "שדה ראייה"/"שדה-ראייה" entries, which lack the ה prefix).
      - "שדות הראייה"
      - "WFOV"
      - "NFOV"
      - "wide field of view"
      - "narrow field of view"
      - "spot FOV"
    group_he: "אופטיקה"
    required: true
    notes_he: >-
      מוצר עם ריבוי שדות ראייה (רחב/צר/ספוט) מדווח כערכים נפרדים תחת variant של אותו parameter_he,
      לא כפרמטר חדש; אין למזג לערך ממוצע.

  - key: optical_aperture
    table: "specifications"
    label_he: "קוטר אפרטורה אופטית"
    label_en: "Optical Aperture Diameter"
    unit: "אינץ׳ / מ״מ"
    value_type: range
    synonyms:
      - "אפרטורה"
      - "קוטר עדשה"
      - "קוטר טלסקופ"
      - "aperture"
      - "aperture diameter"
      - "lens diameter"
      - "telescope diameter"
    group_he: "אופטיקה"
    required: false
    notes_he: "לעיתים מדווח כטווח לפי ערוץ (EO/IR/ספוטר) -- לשמור ערוצים נפרדים כשורות variant נפרדות."

  - key: zoom_range
    table: "specifications"
    label_he: "טווח זום"
    label_en: "Zoom Range"
    unit: "פי (x) / מ״מ (טווח מוקד)"
    value_type: range
    synonyms:
      - "טווח זום"
      - "זום רציף"
      - "zoom range"
      - "continuous zoom"
      - "optical zoom"
      - "digital zoom"
    group_he: "אופטיקה"
    required: false
    notes_he: "יש להבחין בין זום אופטי לזום דיגיטלי -- אינם אותו ערך."

  - key: detector_type
    table: "specifications"
    label_he: "סוג/י גלאי"
    label_en: "Detector Type(s)"
    unit: null
    value_type: list
    synonyms:
      - "גלאי"
      - "חיישן"
      - "MWIR"
      - "LWIR"
      - "SWIR"
      - "VNIR"
      - "VIS"
      - "cooled detector"
      - "uncooled detector"
      - "InSb"
      - "detector"
    group_he: "חיישנים"
    required: true
    notes_he: "רשימת כל ערוצי הגלאי (למשל MWIR+SWIR+VIS) -- לא לצמצם לערוץ אחד כשהמקור מפרט כמה."

  - key: resolution
    table: "specifications"
    label_he: "רזולוציה (מערך גלאי)"
    label_en: "Detector Resolution"
    unit: "פיקסלים"
    value_type: text
    synonyms:
      - "רזולוציה"
      - "resolution"
      - "pixel array"
      - "pixel count"
      - "megapixel"
    group_he: "חיישנים"
    required: false
    notes_he: "ערך לפי ערוץ (למשל רזולוציית MWIR שונה מרזולוציית VIS) -- variant נפרד לכל ערוץ."

  - key: netd
    table: "specifications"
    label_he: "רגישות תרמית (NETD)"
    label_en: "Noise Equivalent Temperature Difference (NETD)"
    unit: "mK"
    value_type: number
    synonyms:
      - "NETD"
      - "רגישות תרמית"
      - "noise equivalent temperature difference"
      - "thermal sensitivity"
    group_he: "חיישנים"
    required: false
    notes_he: ""

  - key: spectral_channels_count
    table: "specifications"
    label_he: "מספר ערוצים ספקטרליים"
    label_en: "Spectral Channel Count"
    unit: "ערוצים"
    value_type: number
    synonyms:
      - "ערוצים ספקטרליים"
      - "חיישנים דיגיטליים"
      - "multi-spectral"
      - "spectral channels"
      - "number of sensors"
    group_he: "חיישנים"
    required: false
    notes_he: "גרסאות SPECTRO XR הדגימו טווח -- 'עד 9 חיישנים דיגיטליים' -- לדווח את הערך המדויק כפי שפורסם, לא עיגול."

  - key: detection_range_dri
    table: "performance"
    label_he: "טווח זיהוי/הכרה/זיהוי-ודאי (DRI)"
    label_en: "Detection/Recognition/Identification (DRI) Range"
    unit: "ק״מ"
    value_type: range
    synonyms:
      - "DRI"
      - "טווח זיהוי"
      - "טווח הכרה"
      - "טווח זיהוי-ודאי"
      - "טווח גילוי"
      - "detection range"
      - "recognition range"
      - "identification range"
      - "טווח תפעולי"
      - "Ultra-Long-Range"
    group_he: "ביצועי מערכת"
    required: true
    notes_he: >-
      חובה לשמור בנפרד: (1) האם הערך המדווח הוא D (גילוי)/R (הכרה)/I (זיהוי-ודאי) -- שלושה טווחים
      שונים מהותית; (2) גודל היעד שעליו מבוסס החישוב (סטנדרט NATO: רכב/אדם) -- שני מקורות עם הגדרת
      יעד שונה אינם ניתנים להשוואה ישירה גם אם שניהם מדווחים "DRI"; (3) claimed (יצרן) לעומת
      demonstrated (ניסוי/מבצעי) -- שתי שורות נפרדות ב-performance, לא מוזגות.

  - key: size_to_performance_ratio
    table: "performance"
    label_he: "יחס ביצועים-למעטפת"
    label_en: "Aperture-to-Envelope / Size-to-Performance Ratio"
    unit: null
    value_type: text
    synonyms:
      - "יחס גודל-לביצועים"
      - "ביצועי אופטיקה"
      - "עומס אופטי במארז קומפקטי"
      - "ביצועי עומס אופטי"
      - "size to performance"
      - "compact housing performance"
      - "aperture-class performance in a smaller envelope"
    group_he: "ביצועי מערכת"
    required: false
    notes_he: >-
      פרמטר זה קיים בדיוק כדי לתפוס טענת שיווק חוזרת ("ביצועי מטע״ד X אינץ׳ במעטפת Y אינץ׳") שדוסיירים
      קודמים כינו בארבע צורות שונות (ראו הערת הכותרת של קובץ זה) -- זהו הערך היחיד שאמור לקלוט אותה
      מעכשיו, לא שורת מפרט/ביצועים אד-הוק. value הוא הציטוט כפי שפורסם (למשל "ביצועי מטע״ד בגודל 20
      אינץ׳ בתוך מארז פיזי של 15 אינץ׳"); אינו מחליף את targeting_pods.pod_class_diameter (המספר
      הקונקרטי של מחלקת הקוטר) -- שני הפרמטרים משלימים זה את זה, לא כפולים.

  - key: adverse_weather_performance
    table: "performance"
    label_he: "ביצועים בתנאי מזג אוויר קשים"
    label_en: "Adverse-Weather / Obscurant Penetration Performance"
    unit: null
    value_type: text
    synonyms:
      - "תנאי מזג אוויר קשים"
      - "ראייה בערפל"
      - "חדירת עשן"
      - "adverse weather"
      - "haze penetration"
      - "fog penetration"
      - "all weather"
      - "SWIR haze"
    group_he: "ביצועי מערכת"
    required: false
    notes_he: "לרוב נסמך על ערוץ SWIR -- לציין את הערוץ הספציפי כשהמקור מפרט אותו."

  - key: target_tracker_atr
    table: "specifications"
    label_he: "עוקב מטרות / זיהוי אוטומטי (ATR)"
    label_en: "Target Tracker / Automatic Target Recognition (ATR)"
    unit: null
    value_type: text
    synonyms:
      - "עוקב מטרות"
      - "ATR"
      - "automatic target recognition"
      - "video tracker"
      - "מעקב וידאו"
      - "בינה מלאכותית"
      - "AI"
      - "target recognition"
      - "target classification"
    group_he: "ביצועי מערכת"
    required: false
    notes_he: >-
      כולל גם יכולות מבוססות AI/מחשוב-קצה (למשל 'מחשב-על מבוסס NVIDIA Jetson') כאשר המקור מקשר אותן
      במפורש ליכולת המעקב/הזיהוי, לא כפרמטר חומרה נפרד.

  - key: line_of_sight_stabilization
    table: "specifications"
    label_he: "ייצוב קו ראייה"
    label_en: "Line-of-Sight (LOS) Stabilization"
    unit: "מיקרו-רדיאן (µrad, RMS)"
    value_type: range
    synonyms:
      - "ייצוב"
      - "ייצוב קו ראייה"
      - "stabilization"
      - "line of sight stabilization"
      - "LOS stabilization"
      - "מיוצב-גירו"
      - "gyro-stabilized"
    group_he: "ייצוב ובקרה"
    required: true
    notes_he: "ערך ה-µrad RMS אינו תמיד מפורסם -- כשלא, לשמור את התיאור האיכותני (למשל 'מיוצב-גירו') כ-value."

  - key: gimbal_axes_class
    table: "specifications"
    label_he: "גימבל -- מספר צירים וסוג"
    label_en: "Gimbal Axes Count / Class"
    unit: "צירים"
    value_type: text
    synonyms:
      - "גימבל"
      - "צירי גימבל"
      - "gimbal"
      - "axis"
      - "axes"
      - "SERVO"
      - "2-axis"
      - "4-axis"
    group_he: "ייצוב ובקרה"
    required: false
    notes_he: ""

  - key: inertial_sensors_imu
    table: "specifications"
    label_he: "חיישני אינרציה (IMU)"
    label_en: "Inertial Measurement Unit (IMU) Sensors"
    unit: null
    value_type: text
    synonyms:
      - "IMU"
      - "חיישני IMU"
      - "inertial measurement unit"
      - "fiber-optic gyro"
      - "סיבים אופטיים"
    group_he: "ייצוב ובקרה"
    required: false
    notes_he: ""

  - key: laser_rangefinder
    table: "specifications"
    label_he: "מד-טווח לייזר (LRF)"
    label_en: "Laser Range Finder (LRF)"
    unit: "ק״מ"
    value_type: range
    synonyms:
      - "מד טווח לייזר"
      - "מד-טווח לייזר"
      - "LRF"
      - "LTDRF"
      - "laser range finder"
      - "eye-safe LRF"
      - "eye safe laser"
      #: PD-fix-4 (2026-09-09, item 1): the live SPECTRO XR run-8 corpus's own overflow row read
      #: "...של מד הטווח (Rangefinder)." -- without a "לייזר" suffix, so none of the "לייזר"-suffixed
      #: synonyms above matched it; "rangefinder" alone (the parenthetical English gloss the source
      #: itself used) didn't match "laser range finder" either (a 3-word phrase, not a substring).
      - "מד הטווח"
      - "rangefinder"
    group_he: "לייזר"
    required: true
    notes_he: "לציין אם 'בטוח לעין' (eye-safe) מצוין במפורש -- זו דרישה תפעולית נפרדת מטווח המדידה עצמו."

  - key: laser_designator_illuminator
    table: "specifications"
    label_he: "מצביע/מאיר לייזר"
    label_en: "Laser Designator / Illuminator"
    unit: null
    value_type: text
    synonyms:
      - "מצביע לייזר"
      - "מאיר לייזר"
      - "מסמן לייזר"
      - "laser designator"
      - "laser illuminator"
      - "laser target marker"
      - "laser pointer"
      #: PD-fix-4 (2026-09-09, item 1): the live SPECTRO XR run-8 corpus's own overflow row read
      #: "...של מציין הלייזר (Designator)." -- "מציין לייזר" is the standard Hebrew defense-industry
      #: term for a laser designator, and "designator" alone is the parenthetical English gloss the
      #: source itself used; neither matched the existing "מצביע/מאיר/מסמן לייזר" synonyms above.
      - "מציין לייזר"
      - "designator"
    group_he: "לייזר"
    required: false
    notes_he: "מצביע (pointer, לצפייה) ומסמן/מאיר (marker/illuminator, לתאורת מטרה) הם שני רכיבים -- variant נפרד לכל אחד כשהמקור מבחין ביניהם."

  - key: weight
    table: "specifications"
    label_he: "משקל"
    label_en: "Weight"
    unit: "ק״ג"
    value_type: number
    synonyms:
      - "משקל"
      - "weight"
      - "mass"
      - "kg"
    group_he: "מכניקה וסביבה"
    required: true
    notes_he: "משקל כולל (gross) לעומת משקל תשלובת/payload בלבד -- לציין variant כשהמקור מבחין."

  - key: envelope_dimensions
    table: "specifications"
    label_he: "נפח/מעטפת"
    label_en: "Envelope Dimensions / Volume"
    unit: "מ״מ / ליטר"
    value_type: text
    synonyms:
      - "מעטפת"
      - "נפח"
      - "מידות"
      - "envelope"
      - "dimensions"
      - "volume"
      - "diameter"
      - "length"
      #: PD-fix-4 (2026-09-09, item 1): the live SPECTRO XR run-8 corpus's own overflow rows read
      #: "קוטר המערכת."/"גובה המערכת." (diameter/height) -- the Hebrew "קוטר"/"גובה" terms, distinct
      #: from the existing Latin "diameter"/"length" synonyms (which never match a Hebrew-only
      #: source sentence, per this file's own Hebrew-substring/Latin-word-boundary dispatch).
      - "קוטר"
      - "גובה"
      - "height"
    group_he: "מכניקה וסביבה"
    required: true
    notes_he: ""

  - key: environmental_qualification
    table: "specifications"
    label_he: "תנאי סביבה (הסמכה)"
    label_en: "Environmental Qualification"
    unit: null
    value_type: text
    synonyms:
