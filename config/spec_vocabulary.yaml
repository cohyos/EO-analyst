      - "טמפרטורת הפעלה"
      - "operating temperature"
    group_he: "מכניקה וסביבה"
    required: true
    notes_he: "לשמור תקן/סעיף ספציפי (למשל 'MIL-STD-810H') כשמצוין, לא רק 'עומד בתקן צבאי' כללי."

  - key: power_consumption
    table: "specifications"
    label_he: "הספק / צריכת חשמל"
    label_en: "Power Consumption"
    unit: "ואט (W) / וולט (V)"
    value_type: range
    synonyms:
