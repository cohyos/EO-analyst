  # ================================================================================================
  # A15 (2026-09-06, docs/TENDER_PORTALS.md): global portal survey -- every source below was
  # live-probed with a single polite GET/POST (20s timeout) on 2026-09-06. `verified: true` api_json/
  # rss entries here were confirmed to return a real, parseable, keyless listing that day; api_json
  # entries with `parse_hints.format: ocds`/`json_list` are parsed by the matching *generic*,
  # config-driven parser in eoa.tenders.scan (`_parse_generic_ocds`/`_parse_generic_json_list`) --
  # no bespoke Python needed per source. See docs/TENDER_PORTALS.md for the full survey table
  # (every portal considered, including ones with no entry below because nothing useful could be
  # added beyond what's already documented there).
  # ================================================================================================

  # ---------------------------------------------------------- TED CPV-code rotation (EU, api_json)
  - id: ted_eu_cpv
    name: "TED (Tenders Electronic Daily) -- EU, CPV classification codes"
    kind: api_json
    country: EU
    url: "https://api.ted.europa.eu/v3/notices/search"
    method: POST
    # Coordinator requirement: extend TED coverage to CPV codes for optics/defence (35xxxxxx
    # security/surveillance equipment, 38xxxxxx optical/precision instruments) rather than only
    # free-text phrases -- TED v3's expert query field for this is `classification-cpv` (verified
    # live 2026-09-06; the naive `CPV=...`/`cpv=...`/`classification=...` field names all return
    # HTTP 400 QUERY_UNKNOWN_FIELD, only `classification-cpv` is accepted). Each "keyword" below is
    # actually an 8-digit CPV code, rotated the same way ted_eu rotates free-text phrases.
    query_template: '{"query":"classification-cpv={keyword}","fields":["ND","TI","PD","publication-number","links"],"limit":20}'
    # `keywords` stays the normal domain vocabulary (*kw) -- it is what the two-signal gate checks
    # against each returned notice's title+summary TEXT (_matches_keywords), which obviously never
    # contains a raw CPV code. `api_query_keywords` below is the separate list actually rotated into
    # the API query itself (see TenderSource.api_query_keywords's docstring, eoa.tenders.scan).
    keywords: *kw
    api_query_keywords:
      - "38620000" # Optical instruments
      - "35120000" # Surveillance and security systems and devices
      - "35125000" # Detection equipment
    parse_hints:
      format: json
      notice_path: notices
      id_field: ND
      title_field: "TI.eng"
      title_fallback_any_lang: true
      date_field: PD
      url_field: "links.htmlDirect.ENG"
    verified: true
    verified_at: "2026-09-06"
    notes: >
      Verified via curl POST {"query":"classification-cpv=38620000","fields":["ND","TI"],"limit":2}
      -> HTTP 200, real notices (a Hungary-Szeged laboratory/optical-equipment notice came back).
      Same parser as `ted_eu` (registered under this source's own id in
      eoa.tenders.scan._API_PARSERS -- identical response shape). No API key needed.

  # ------------------------------------------------------- UK Find a Tender Service (api_json, OCDS)
  - id: uk_find_tender
    name: "UK Find a Tender Service (FTS, OCDS) -- above-threshold notices"
    kind: api_json
    country: UK
    url: "https://www.find-tender.service.gov.uk/api/1.0/ocdsReleasePackages"
    method: GET
    # FTS's bulk OCDS feed has no working full-text search param -- `q=`/`keywords=` were tested
    # live (2026-09-06) against terms known to be present in the current unfiltered feed and both
    # silently returned zero releases, so they are not wired here (unlike uk_contracts_finder,
    # where `keyword=` at least returns *something*, just unreliably ranked). `stages=tender` is a
    # real, working filter (limits to open/current tender-stage releases rather than every stage of
    # the contracting lifecycle). This means every keyword-loop iteration in
    # eoa.tenders.scan._collect_source_notices fetches the same page of the latest tender-stage
    # releases regardless of which keyword is "active" -- harmless (deduped by external_ref; the
    # two-signal gate, using this entry's own `keywords` list, does 100% of the real filtering over
    # whatever page comes back) but means the endpoint is polled up to MAX_KEYWORDS_PER_API_SOURCE
    # (5) times per scan for an unchanging response. Left as-is rather than special-casing the
    # shared keyword-loop for one source; the page itself is small (~12KB for limit=100).
    query_params: { stages: "tender", limit: "100" }
    keywords: *kw
    parse_hints:
      format: ocds
      notice_path: releases
      id_field: id
      title_field: "tender.title"
      summary_field: "tender.description"
      agency_field: "buyer.name"
      date_field: date
      deadline_field: "tender.tenderPeriod.endDate"
      # Best-effort canonical notice URL (FTS's own citizen-facing page returned HTTP 403 to a
      # curl probe on 2026-09-06 -- Cloudflare/bot-protection on the human UI, not proof the URL
      # pattern itself is wrong; this is FTS's documented public notice-URL convention).
      url_pattern: "https://www.find-tender.service.gov.uk/Notice/{id}"
    verified: true
    verified_at: "2026-09-06"
    notes: >
      Verified via curl GET ?limit=5&stages=tender -> HTTP 200, real OCDS 1.1 release package (5
      releases, each with a populated `buyer`/`tender.title`/`tender.tenderPeriod.endDate`). Parsed
      by the generic `_parse_generic_ocds` (eoa.tenders.scan), driven entirely by `parse_hints`
      above -- no bespoke parser function needed. No API key needed.

  # --------------------------------------------------------- France BOAMP open data (api_json, JSON)
  - id: fr_boamp
    name: "France BOAMP (Bulletin officiel des annonces des marchés publics) -- open data"
    kind: api_json
    country: FR
    url: "https://boamp-datadila.opendatasoft.com/api/records/1.0/search/"
    method: GET
    query_params: { dataset: "boamp", rows: "20", q: "{keyword}" }
    keywords: *kw
    parse_hints:
      format: json_list
      notice_path: records
      id_field: "fields.id"
      title_field: "fields.objet"
      summary_field: "fields.type_marche_facette"
      agency_field: "fields.nomacheteur"
      date_field: "fields.dateparution"
      deadline_field: "fields.datelimitereponse"
      url_field: "fields.url_avis"
    verified: true
    verified_at: "2026-09-06"
    notes: >
      Verified via curl GET ?dataset=boamp&rows=1&q=electro-optique -> HTTP 200, 22 real hits, incl.
      a genuine MINARM (French Ministry of Defence)/PFC Brest notice for "dispositifs
      électro-optiques / infrarouge de surveillance maritime". The dataset's modern EFORMS-era
      `donnees` field is a deeply-nested eForms/UBL JSON blob (not used here); the flat sibling
      fields (`objet`, `nomacheteur`, `dateparution`, `datelimitereponse`, `url_avis`) used by
      `parse_hints` above are stable, simple, and present on every record. Parsed by the generic
      `_parse_generic_json_list`. No API key needed.

  # --------------------------------------------------------- Netherlands TenderNed (api_json, JSON)
  - id: nl_tenderned
    name: "Netherlands TenderNed -- publicaties (open data)"
    kind: api_json
    country: NL
    url: "https://www.tenderned.nl/papi/tenderned-rs-tns/v2/publicaties"
    method: GET
    # Every `zoekterm=`/`trefwoord=`/`q=`/`aanbestedingNaam=` guess tried live (2026-09-06) returned
    # the exact same first record regardless of value -- this endpoint has no working keyword filter
    # from the outside (same situation as uk_find_tender above); `page` is the only param that
    # actually changes the response. Client-side two-signal gate does all the real filtering.
    query_params: { page: "1" }
    keywords: *kw
    parse_hints:
      format: json_list
      notice_path: content
      id_field: publicatieId
      title_field: aanbestedingNaam
      summary_field: opdrachtBeschrijving
      agency_field: opdrachtgeverNaam
      date_field: publicatieDatum
      deadline_field: sluitingsDatum
      url_field: "link.href"
    verified: true
    verified_at: "2026-09-06"
    notes: >
      Verified via curl GET ?page=1 -> HTTP 200, real JSON (`content: [...]` publicaties with
      `aanbestedingNaam`/`opdrachtgeverNaam`/`sluitingsDatum`/`link.href`). Parsed by the generic
      `_parse_generic_json_list`. No API key needed.

  # ------------------------------------------------------------- Spain PLACSP (rss/Atom, keyless)
  - id: es_placsp_atom
    name: "Spain PLACSP (Plataforma de Contratación del Sector Público) -- Atom feed"
    kind: rss
    country: ES
    url: "https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom"
    keywords: *kw
    verified: true
    verified_at: "2026-09-06"
    notes: >
      Verified via curl GET -> HTTP 200, `Content-Type: application/atom+xml`, a genuine (large,
      ~2MB) Atom feed of all current licitaciones across every contracting-authority profile on the
      platform. Parsed by the already-generic `_parse_rss_notices`/`eoa.fetch.rss.parse_feed`
      (feedparser handles Atom and RSS 2.0 alike -- no separate "atom" `kind` needed). No API key
      needed; the whole-platform feed means the two-signal gate carries all of the actual
      relevance filtering (this is not a keyword-scoped feed).

  # -------------------------------------------------------------------- US Grants.gov (api_json)
  - id: us_grants_gov
    name: "US Grants.gov -- search2 API"
    kind: api_json
