    country: US
    url: "https://api.sam.gov/opportunities/v2/search"
    method: GET
    query_params: { api_key: DEMO_KEY, keyword: "{keyword}", limit: "25" }
    keywords: *kw
    parse_hints: { format: json, notice_path: opportunitiesData }
    verified: false
    verified_at: "2026-09-04"
    needs_key_env_var: SAM_GOV_API_KEY
    notes: >
      curl GET with api_key=DEMO_KEY (SAM.gov's documented public demo key) -> HTTP 404 for both
      /opportunities/v2/search and /prod/opportunities/v2/search. The v2 DEMO_KEY path appears to
      have been retired/moved behind a real per-user key since this doc's endpoint was written.
      Not polled directly by eoa.tenders.scan; covered instead by `sam_gov_search` below.

  - id: sam_gov_search
    name: "SAM.gov opportunities -- SearXNG fallback"
    kind: search
    country: US
    engine_lang: en
    queries:
      - "site:sam.gov opportunity electro-optical"
      - "site:sam.gov opportunity infrared targeting pod"
      - "site:sam.gov sources sought counter-UAS"
    keywords: *kw
    verified: true
    verified_at: "2026-09-04"
    notes: "Runs through the already-verified SearXNG client (eoa.search.searxng_client); does not depend on sam.gov's own API/bot-protection."

