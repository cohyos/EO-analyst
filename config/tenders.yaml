  - id: eu_sedia_funding_tenders
    name: "EU Funding & Tenders Portal -- SEDIA search API"
    kind: api_json
    country: EU
    url: "https://api.tech.ec.europa.eu/search-api/prod/rest/search"
    method: GET
    query_params: { apiKey: "SEDIA", text: "{keyword}", pageSize: "10" }
    keywords: *kw
    parse_hints: { format: json_list, notice_path: results, id_field: reference, title_field: summary, summary_field: content, url_field: url }
    # Reachable and genuinely keyless (SEDIA is the documented public apiKey literal, not a secret)
    # -- `verified: false` here is deliberate even though the live probe succeeded: this codebase's
    # `verified` flag doubles as scan_tenders's own poll-or-skip gate for `kind: api_json`
    # (`if src.kind == "api_json" and not src.verified: continue`), and this source is intentionally
    # NOT polled yet (see notes) -- setting `verified: true` would make eoa.tenders.scan actually
    # call this API on every scan despite the caveats below.
    verified: false
    verified_at: "2026-09-06"
    notes: >
      Verified reachable via curl GET ?apiKey=SEDIA&text=electro-optical&pageSize=2 -> HTTP 200,
      real JSON (21,723 total hits reported) -- genuinely keyless, no registration needed. Still not
      wired into eoa.tenders.scan (`verified: false` above is deliberate, not "this failed"):
      this is a general-purpose search index across every content type on the Funding & Tenders
      portal (organisation profiles, topics, news, calls all mixed in the same `results` array --
      the live sample's first hit was a company profile page, "LIDAX ELECTRO-OPTICAL SYSTEMS S.L.",
      not a call for proposals), and `content`/`summary` come back with embedded `<b>` highlight
      tags. Since this is `kind: api_json`, the two-signal gate's procurement signal is implicit
      (any domain-keyword hit passes straight to the LLM gate) -- feeding this heterogeneous index
      in as-is would send a lot of non-tender company/topic noise to the LLM classifier. A future
      follow-up should add a `type=call`-only filter (the SEDIA API supports faceting by content
      type) and strip the highlight markup before wiring this in for real.

