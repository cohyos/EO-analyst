# EO-Analyst tender / RFI / RFP source registry (FR-5.2 / section 5.2 of the spec).
#
# Loaded by eoa.tenders.scan.load_tender_sources() into validated pydantic models.
# Every source was checked with curl on 2026-09-04 (see `verified` / `verified_at` / `notes` per
# entry). Sources whose own API/page is not reliably reachable/parseable (bot-protected, JS-shell,
# DNS failure, deprecated key) are marked `verified: false` and are NOT skipped -- they still
# appear here for documentation/coordination purposes, but `eoa.tenders.scan` only actually polls
# `kind: api_json` sources directly (verified: true) plus every `kind: search` source (these run
# through the already-verified, keyless SearXNG metasearch client, so they don't depend on the
# target site's own bot-protection). `kind: html`/`kind: rss` entries with `verified: false` are
# kept as documentation of "known dead ends" (per FR-1.3: a failing source never blocks the
# pipeline) with a `notes` explaining why.
#
# Keywords are the shared EO/IR/CV DOMAIN-signal vocabulary (section 2 of the spec) used by
# eoa.tenders.scan for client-side keyword filtering -- every source's server-side "keyword"
# param (when it has one) is unreliable/best-effort, so this filter is always re-applied locally.
# `eoa.tenders.scan._passes_gate` requires this DOMAIN signal to be paired with a PROCUREMENT
# signal (`procurement_signals` below) before a notice is ever stored -- deliberately precise
# multi-word phrases; a bare generic word ("camera", "windows", "sensor") is never enough on its
# own, only e.g. "surveillance camera".
keywords: &kw
  - electro-optical
  - electro-optic
  - electro optic
  - electro-optics
  - EO/IR
  - infrared
  - thermal imaging
  - thermal imager
  - FLIR
  - targeting pod
  - gimbal
  - laser rangefinder
  - laser designator
  - seeker
  - night vision
  - image intensifier
  - optronic
  - optronics
  - surveillance camera
  - counter-UAS
  - C-UAS
  - counter-drone
  - drone detection
  - hyperspectral
  - computer vision
  - ATR
  - IRST
  - imaging sensor

# PROCUREMENT signal vocabulary: at least one of these must also be present (in title+summary) for
# a notice from a general source (kind: search / rss) before it is stored -- this is what keeps a
# Wikipedia "What is Infrared" article or a NASA outreach page out even though it mentions
# "infrared". A structured procurement-portal API (kind: api_json -- TED, Contracts Finder) is
# itself already conclusive evidence of "this is a tender", so this signal is implicit there
# (eoa.tenders.scan._has_procurement_signal) -- most real notices never literally spell "tender"
# in their title text, so requiring the word there too would reject the majority of genuine ones.
procurement_signals: &proc
  - tender
  - RFP
  - RFI
  - RFQ
  - solicitation
  - sources sought
  - invitation to tender
  - contract notice
  - prior information notice
  - request for proposal
  - request for information
  - request for quotation
  - call for proposals
  - מכרז
  - בקשה למידע
  - בקשת מידע

# Hosts never treated as a tender/RFI/RFP lead regardless of keyword matches -- defense-in-depth
# against a general SearXNG web search returning content (encyclopedia articles, market-research
# press releases, social media, consumer tech news) that happens to mention a domain term without
# being a procurement source at all. Matched by exact domain or subdomain
# (eoa.tenders.scan._is_denylisted_domain), applied to every `kind: search`/`kind: rss` hit before
# the two-signal gate even runs.
deny_domains: &deny
  - wikipedia.org
  - reddit.com
  - youtube.com
  - facebook.com
  - twitter.com
  - x.com
  - instagram.com
  - linkedin.com
  - quora.com
  - medium.com
  - britannica.com
  - nasa.gov
  - marketsandmarkets.com
  - grandviewresearch.com
  - alliedmarketresearch.com
  - researchandmarkets.com
  - globenewswire.com
  - prnewswire.com
  - businesswire.com
  - techradar.com
  - sciencenotes.org
  - scienceinsights.org
  - coolcosmos.ipac.caltech.edu
  - howstuffworks.com
  - thoughtco.com
  - investopedia.com
  # F24 (docs/QA_PROGRAM.md section 4, 2026-09-06): document-hosting/aggregator sites -- a page
  # here is someone's re-upload of a PDF/slide deck (often years old), never the live notice
  # itself, so it is always rejected outright rather than risk showing a stale or misattributed
  # "tender" (e.g. a Scribd-hosted "RFP for EO/IR Pods for Heron UAV" scan with no verifiable
  # status).
  - scribd.com
  - docplayer.net
  - docplayer.com
  - yumpu.com
  - slideshare.net
  - pdfcoffee.com
  - coursehero.com

sources:
  # ---------------------------------------------------------------- TED (EU) -- api_json, verified working
  - id: ted_eu
    name: "TED (Tenders Electronic Daily) -- EU"
    kind: api_json
    country: EU
    url: "https://api.ted.europa.eu/v3/notices/search"
    method: POST
    # TED v3 "expert query" syntax: `FT ~ "<term>"` is a full-text search operator. One request
    # per keyword (rotated by eoa.tenders.scan, capped) -- the API has no native OR-of-phrases
    # syntax that stayed inside the 400-safe subset we could verify.
    query_template: '{"query":"FT ~ \"{keyword}\"","fields":["ND","TI","PD","publication-number","links"],"limit":20}'
    keywords: *kw
    parse_hints:
      format: json
      notice_path: notices
      id_field: ND
      title_field: "TI.eng"
      title_fallback_any_lang: true
      date_field: PD
      url_field: "links.htmlDirect.ENG"
    verified: true
    verified_at: "2026-09-04"
    notes: >
      Verified via curl POST with body {"query":"FT ~ \"electro-optical\"","fields":["ND","TI","PD"],"limit":2} ->
      HTTP 200, real notices (TI is a per-language dict, "eng" present on most EU-wide notices).
      A bare/undelimited query string returns HTTP 400 QUERY_SYNTAX_ERROR -- the FT operator with
      quoted phrase is required. No API key needed.

  # ---------------------------------------------------------- UK Contracts Finder -- api_json, verified working
  - id: uk_contracts_finder
    name: "UK Contracts Finder (OCDS)"
    kind: api_json
    country: UK
    url: "https://www.contractsfinder.service.gov.uk/Published/Notices/OCDS/Search"
    method: GET
    query_params: { keyword: "{keyword}" }
    keywords: *kw
    parse_hints:
      format: json
      notice_path: releases
      id_field: ocid
      title_field: "tender.title"
      summary_field: "tender.description"
      agency_field: "buyer.name"
      deadline_field: "tender.tenderPeriod.endDate"
      status_tag_field: tag
      # No direct notice-URL field in the OCDS payload; the release id is
      # "<uuid>-<internal-int>" -- eoa.tenders.scan extracts the leading UUID and builds
      # https://www.contractsfinder.service.gov.uk/Notice/<uuid>.
      url_pattern: "https://www.contractsfinder.service.gov.uk/Notice/{uuid}"
    verified: true
    verified_at: "2026-09-04"
    notes: >
      Verified via curl GET ?keyword=electro-optical -> HTTP 200, real OCDS JSON (100 releases
      returned). The server-side `keyword` filter is not reliable (unrelated releases came back
      first) -- client-side keyword re-filtering in eoa.tenders.scan is mandatory. No API key needed.

  # ---------------------------------------------------------------- SAM.gov (US) -- documented, currently dead
