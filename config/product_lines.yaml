      - "צילום אלכסוני ארוך טווח"
      - "פוד סיור ארוך טווח"
      - "פוד סיור"
    keywords_en:
      - "long-range oblique photography"
      - "long-range oblique"
      - "LOROP pod"
      - "reconnaissance pod"
      - "oblique photography pod"
    aliases: ["LOROP"]
    subdomains: ["airborne_pods.isr_pods", "airborne_pods.lorop"]
    exemplar_systems:
      - "DB-110"
      - "MS-110"
      - "Condor 2"
      - RecceLite
      - "RecceLite XR"
    competitors:
      - "Collins Aerospace"
