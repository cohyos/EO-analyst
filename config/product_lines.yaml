# Six EO/IR product lines tracked for status & business-development reporting (PL-backend,
# user request 2026-09-07). `id`s are FROZEN -- the frontend (web/src/lib/productLines.ts) uses
# these exact ids as a fixed catalog and the API contract keys every response on them; never
# rename/remove an id here without coordinating a frontend change first.
#
# Fields per line:
#   id                stable key (frozen, matches web/src/lib/productLines.ts)
#   name_he/name_en   display names (kept in sync with web/src/lib/productLines.ts by convention,
#                     not read from there -- this file is the backend's own source of truth)
#   keywords_he       Hebrew substring keywords (matched as plain substrings against summary/so_what)
#   keywords_en       English/Latin keywords (matched with word-boundary regex, see
#                     eoa.product_lines.tagging -- short acronyms like "MWS" need this to avoid
#                     matching inside an unrelated longer word)
#   aliases           additional English/Latin alias phrases, matched the same way as keywords_en
#   subdomains        config/taxonomy.yaml domain.sub keys this product line maps onto -- an item
#                     classified into one of these subdomains is tagged by construction
#   exemplar_systems  named real-world systems in this product line (strong signal on their own,
#                     matched by text word-boundary or by an exact entities_mentioned hit)
#   competitors       named companies competing in this product line -- NOT enough on their own
#                     (see eoa.product_lines.tagging docstring): only tags when a subdomain match
#                     also holds, since a bare company name recurs across many unrelated stories
#   our_products      empty unless config.yaml's bd_report.our_company names a real product line
#                     (left empty here; the operator can populate this alongside our_company)
#   conditional_keywords_en  optional list of {term, context} pairs (R8-tagging, 2026-09-07) -- a
#                     term here only counts as a signal when it AND at least one of its own
#                     `context` terms both appear (word-boundary for Latin, substring for Hebrew,
#                     checked across both text_he and text_en) -- see
#                     eoa.product_lines.tagging._conditional_match. Used for terms that are
#                     genuinely ambiguous on their own (e.g. "DIRCM" names a jam/dazzle emitter,
#                     which only overlaps mws_eo's self-protection domain when the surrounding text
#                     is actually about self-protection/missile-warning, not e.g. a bare mention in
#                     a program-list article) -- keeps such terms out of the unconditional
#                     keywords_en/aliases/exemplar_systems lists (which are strong signals on their
#                     own) without dropping them from the tagger's recall entirely.
#
# R8-tagging (2026-09-07, product-line tagging coverage round): every line's keywords_he/
# keywords_en/aliases/exemplar_systems broadened per the measured recall gap in
# docs/qa/loop/round_8_fixes.md's "R8-tagging status" section -- short Latin tokens (e.g. "MWS",
# 'MX-15', '16"') rely on eoa.product_lines.tagging's word-boundary matching to avoid false
# positives inside longer unrelated words/model numbers.

# llm_tagging (R8-tagging, 2026-09-07): when true, an in-scope item/patent that still has no
# deterministic product-line tag after eoa.product_lines.tagging.tag_product_lines gets one more
# shot at LLM-assisted tagging -- eoa.product_lines.llm_tagging.llm_tag_batch, called from the
# eoa.pipeline.analyze post-analysis hook (one item at a time there) and from
# scripts/backfill_product_lines.py --llm (batches of ~15 items per structured light-role call).
# Only accepts a per-item result at confidence >= LLM_TAG_MIN_CONFIDENCE (0.6); line ids outside
# the closed six-id catalog above are dropped. Read via
# eoa.product_lines.registry.llm_tagging_enabled(); defaults to False (opt-in) when this key is
# absent, so an older/unedited copy of this file never silently starts spending LLM calls.
llm_tagging: true

product_lines:
  - id: targeting_pods
    name_he: "פודי ציון מטרות / תקיפה"
    name_en: "Targeting Pods"
    keywords_he:
      - "פוד ציון מטרות"
      - "פוד ציון"
      - "פוד תקיפה"
      - "פוד כיוון"
      - "כיוון תקיפה"
    keywords_en:
      - "targeting pod"
      - "advanced targeting pod"
      - "laser designator pod"
      - "laser designation pod"
      - "electro-optical targeting system"
    aliases: ["ATP", "NGTP", "EOTS"]
    subdomains: ["airborne_pods.targeting_pods"]
    exemplar_systems:
      - Litening
      - "Sniper ATP"
      - "Sniper pod"
      - ATFLIR
      - "ATP-SE"
      - Damocles
      - Talios
      - LANTIRN
      - "Rafael Litening"
      - PANTERA
    competitors:
      - Rafael
      - "Lockheed Martin"
      - Thales
      - "L3Harris"
    our_products: []

  - id: mws_eo
    name_he: "מערכות התראה להגנה עצמית מבוססות EO (MWS)"
    name_en: "EO-based Missile Warning Systems (MWS)"
    keywords_he:
      - "מערכת התראת טילים"
      - "התראת טילים"
      - "התראה להגנה עצמית"
      - "מערכת הגנה עצמית אלקטרו-אופטית"
      - "מערכת התרעה מפני טילים"
    keywords_en:
      - "missile warning system"
      - "missile warning sensor"
      - "missile warning"
      - "self-protection system"
      - "aircraft survivability equipment"
    aliases: ["MWS", "CMWS", "EOSS", "MAWS", "PAWS"]
    subdomains: ["airborne_pods.eo_warfare", "airborne_pods.mws"]
    exemplar_systems:
      - PAWS
      - "AN/AAR-57"
      - CMWS
      - "AN/AAR-47"
      - MILDS
      - EOSS
      - "AN/AAQ-24"
    competitors:
      - Elbit
      - "BAE Systems"
      - "Northrop Grumman"
      - Hensoldt
    our_products: []
    # R8-tagging: "DIRCM" alone names a jam/dazzle emitter, not a warning sensor -- only a mws_eo
    # signal when it co-occurs with self-protection/missile-warning context (see the field docs
    # header above and eoa.product_lines.tagging._conditional_match).
    conditional_keywords_en:
      - term: "DIRCM"
        context:
          - "self-protection"
          - "self protection"
          - "missile warning"
          - "aircraft survivability"
          - "countermeasure"
          - "IRCM"
          - "להגנה עצמית"
          - "התראת טילים"

