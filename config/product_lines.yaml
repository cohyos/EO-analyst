      - Rafael
    our_products: []

  - id: eo_air_defense_warning
    name_he: "גילוי והתראה אלקטרו-אופטיים להגנה אווירית"
    name_en: "EO Detection & Warning for Air Defense"
    keywords_he:
      - "גילוי והתראה אלקטרו-אופטיים"
      - "גילוי אלקטרו-אופטי"
      - "התראה אווירית אלקטרו-אופטית"
      - "עוקב אלקטרואופטי"
    keywords_en:
      - "EO air defense warning"
      - "electro-optical air surveillance"
      - "IRST ground system"
      - "EO/IR air surveillance"
      - "infrared search and track"
    aliases: ["IRST"]
    subdomains:
      - "air_defense.eo_trackers"
      - "air_defense.eo_air_surveillance"
      - "c_uas.detect_track"
    exemplar_systems:
      - SkySpotter
      - "SupIR"
    competitors:
      - Elbit
      - Rheinmetall
      - Hensoldt
    our_products: []
    # R8-tagging: "EO tracker" / "electro-optical tracking" are generic enough to appear inside
    # other domains (e.g. air_defense.eo_trackers seeker/fire-control text, which belongs to a
    # different concern than a standalone air-surveillance sensor) -- only a signal here when
    # paired with air-defense/C-UAS context.
    conditional_keywords_en:
      - term: "EO tracker"
        context: ["air defense", "air-defense", "c-uas", "counter-uas", "counter uas", "anti-aircraft", "הגנה אווירית"]
      - term: "electro-optical tracking"
        context: ["air defense", "air-defense", "c-uas", "counter-uas", "counter uas", "anti-aircraft", "הגנה אווירית"]

