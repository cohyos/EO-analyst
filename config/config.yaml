# EO-Analyst main configuration. All times are Asia/Jerusalem unless stated.
timezone: Asia/Jerusalem

schedule:
  night_window: { start: "01:00", end: "06:00" }   # batch window (hard deadline at end)
  pre_flight_at: "23:30"                            # backup, health checks, disk/thermal, model warm-up
  daytime_rss_poll_minutes: 120                     # light polling during the day (no heavy LLM)
  weekly_run: { weekday: "sat", start: "01:00" }    # weekly report, conferences, patents (phase C)
  monthly_run: { day: 1 }
  deadline_grace_minutes: 5

stages:            # per-stage time budgets in minutes (scheduler trims later stages if late)
  ingest: 25
  embed_dedup: 10
  dedup_xlang: 3
  classify: 30
  triage: 15
  deep_search: 100
  analyze: 45
  tenders: 15       # section 5.2 / FR-5.2: tender/RFI/RFP scan + forecast (eoa.tenders)
  report: 30
  export_backup: 10

deep_search:
  trigger_levels: [red]
  max_per_night: 4
  max_queries: 15
  max_pages: 30
  per_investigation_timeout_min: 25
  langs_primary: [he, en]
  langs_secondary: [ru, zh, fr, de]        # used from persistence round 3 onward
  confidence_stop: 0.8

triage:
  levels: { red: 8, orange: 6, yellow: 4 }  # min score per level; below yellow = archive
  daily_report_max_items: 10

dedup:
  cosine_threshold: 0.92
  lookback_days: 7

resources:
  vram_total_mb: 12227
  vram_safety_margin_mb: 1200
  min_free_vram_mb: { resident: 9500, light: 6000, embed: 1500 }
  min_free_ram_mb: 2500       # host has 64 GB but the user runs multi-GB data jobs by day; night has headroom
  min_free_disk_gb: 20
  warn_free_disk_gb: 40
  gpu_temp_pause_c: 83
  gpu_temp_stop_c: 88
  queue_backoff_seconds: [5, 10, 30, 60]
  queue_timeout_min: 20
  min_loaded_seconds: 300
  polite_mode:
    external_gpu_util_threshold: 25
    enabled_outside_night_window: true

ollama:
  url: http://127.0.0.1:11434
  keep_alive: "30m"
  num_ctx: { classify: 4096, triage: 4096, summarize: 8192, react: 16384, report: 32768, embed: 512 }
  num_predict: { classify: 700, triage: 400, summarize: 2200, react: 1200, report: 6000 }   # runaway caps; analyze needs ~1100 tokens
  options: { temperature: 0.2, top_p: 0.9 }

models:              # roles -> keys in models.yaml (decided by bake-off, ADR-001)
  resident: dictalm3_12b       # ADR-001: Hebrew prose + JSON stages
  investigator: gemma4_12b     # ADR-001: deep-search ReAct (tool calling)
  light: gemma4_e4b
  hebrew_editor: null
  heavy_investigator: null
  embed: arctic_embed2
  guard_l1: prompt_injection_deberta
  guard_l2: granite_guardian_2b

search:
  # migration step 1b (docs/PLAN_WINDOWS_NATIVE.md): SearXNG (Docker/Linux) goes away on native Windows.
  # provider: ddgs (pure-Python, default, no container needed) | searxng (legacy, requires the container).
  provider: ddgs
  ddgs:
    backends: [duckduckgo, bing, google, brave, yahoo]   # bing/yahoo only resolve for the *news* category in ddgs 9.x
    timeout_s: 15
    max_results: 10

searxng:
  url: http://127.0.0.1:8088   # legacy SearXNG container (search.provider=ddgs is the default now)
  engines: [google, bing, "bing news", "google news"]   # verified 2026-09-04; ddg/brave/startpage get CAPTCHA-suspended
  engines_by_lang: { zh: [baidu, google], ru: [yandex, google], he: [google, "google news", bing] }
  rate_limit_per_minute: 20

fetch:
  timeout_seconds: 20
  max_bytes: 2_000_000
  user_agent: "eo-analyst/0.1 (+local OSINT research; contact: none)"
  respect_robots: true

security:
  quarantine_on_flag: true
  blocklist_after_incidents: 2
  hidden_text_min_ratio: 0.15
  max_base64_blob_chars: 200

report:
  language: he
  formats: [docx, md, html]
  output_dir: output/reports
  template: agent/eoa/report/templates/daily_rtl.docx
  citation_style: numbered      # [n] mapped to items.url
  require_citations: true       # QA blocks uncited claims

notify:
  url: http://127.0.0.1:8091      # native ntfy (ADR-004); NTFY_URL env overrides
  topic: eo-analyst
  public_fallback_url: https://ntfy.sh
  public_fallback_topic: dissertation_editor_ysf
  send_report_link: true
  send_red_alerts: true
  send_security_alerts: true
  clarification_timeout_min: 5
  mirror_to_public: true        # until the phone subscribes to the self-hosted server (Tailscale http://100.70.157.25:8091/eo-analyst)

retention:
  raw_text_days: 90
  logs_days: 30
  backups_keep: 30

api:
  host: 127.0.0.1
  port: 8765
  status_push_seconds: 2

export:
  obsidian: { enabled: true, vault_dir: output/obsidian, entities: true, items: true, reports: true, min_level: yellow }

llm_providers:   # U8 / docs/adr/005-cloud-llm-cli.md — interactive-only cloud models via CLI (never the night pipeline)
  allow_cloud: true                 # kill switch: false disables agy/claude/codex everywhere, chat falls back to ollama
  interactive_default: "ollama"     # "ollama" | "agy[:<model>]" | "claude[:<model>]" | "codex[:<model>]"
  timeout_s: 120
  cli:
    agy:
      binary: agy      # Gemini via Antigravity CLI (resolved through PATH; falls back to an absolute path if set)
      models: [gemini-3.8-flash-medium, gemini-3.8-flash-high, gemini-3.1-pro-high]  # ids from `agy models` (verified 2026-09-05)
    claude:
      binary: claude   # Claude Code CLI
      models: [claude-opus-5, claude-sonnet-5, claude-haiku-4-5-20251001]
    codex:
      binary: codex    # Codex CLI (read-only sandbox, exec mode)
      models: [default]
