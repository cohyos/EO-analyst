# EO-Analyst main configuration. All times are Asia/Jerusalem unless stated.
timezone: Asia/Jerusalem

schedule:
  night_window: { start: "01:00", end: "06:00" }   # batch window (hard deadline at end)
  pre_flight_at: "23:30"                            # backup, health checks, disk/thermal, model warm-up
  daytime_rss_poll_minutes: 120                     # light polling during the day (no heavy LLM)
  weekly_run: { weekday: "sat", start: "01:00" }    # weekly report, conferences, patents (phase C)
  monthly_run: { day: 1 }
  deadline_grace_minutes: 5

stages:            # per-stage time budgets in minutes (scheduler trims later stages if late)
  ingest: 25
  embed_dedup: 10
  dedup_xlang: 3
  classify: 30
  triage: 15
  deep_search: 100
  analyze: 45
  tenders: 45       # section 5.2 / FR-5.2: tender/RFI/RFP scan + forecast (eoa.tenders). 15 -> 30 (2026-09-23, user): with 32+ portals and the SearXNG/search fallbacks the stage hit its 15-min cap and ended `partial` every night; the whole run still finishes ~02:40, far inside the 06:00 window. 30 -> 45 (2026-09-26, user): still hit the 30-min cap on 26.9 (whole run 71 min)
  post_tenders_catchup: 5  # F22: embed+classify+triage catch-up for items the tenders stage just created
  report: 30
  export_backup: 10

deep_search:
  trigger_levels: [red]
  max_per_night: 4
  max_queries: 15
  max_pages: 30
  per_investigation_timeout_min: 25
  langs_primary: [he, en]
  langs_secondary: [ru, zh, fr, de]        # used from persistence round 3 onward
  confidence_stop: 0.8

triage:
  levels: { red: 8, orange: 6, yellow: 4 }  # min score per level; below yellow = archive
  daily_report_max_items: 10

dedup:
  cosine_threshold: 0.92
  lookback_days: 7

# Story-clustering (2026-09-17, "improve same-story grouping" task) -- see
# eoa.pipeline.story_clustering.assign_story_ids and ClusteringCfg's docstring in eoa.config for
# how 0.80 was calibrated against the live Rafael SPICE-1000/F-35 story.
clustering:
  story_embedding_threshold: 0.80
  story_window_days: 3

resources:
  vram_total_mb: 12227
  vram_safety_margin_mb: 1200
  min_free_vram_mb: { resident: 9500, light: 6000, embed: 1500 }
  min_free_ram_mb: 2500       # host has 64 GB but the user runs multi-GB data jobs by day; night has headroom
  min_free_disk_gb: 20
  warn_free_disk_gb: 40
  gpu_temp_pause_c: 83
  gpu_temp_stop_c: 88
  queue_backoff_seconds: [5, 10, 30, 60]
  queue_timeout_min: 20
  interactive_wait_s: 20      # 2026-09-06 P1: interactive (chat) gate wait cap, vs. queue_timeout_min for nightly/pipeline
  min_loaded_seconds: 300
  polite_mode:
    external_gpu_util_threshold: 25
    enabled_outside_night_window: true
  embed_cpu_fallback: true    # 2026-09-26: GPU busy/hot/short on VRAM -> run the same embedding model on CPU instead of deferring embed_dedup
  embed_cpu_threads: 4        # CPU threads for that fallback (leaves the rest of the CPU to other workloads)

ollama:
  url: http://127.0.0.1:11434
  keep_alive: "30m"
  num_ctx: { classify: 4096, triage: 4096, summarize: 8192, react: 16384, report: 32768, embed: 512 }
  num_predict: { classify: 700, triage: 400, summarize: 2200, react: 1200, report: 6000 }   # runaway caps; analyze needs ~1100 tokens
  options: { temperature: 0.2, top_p: 0.9 }

models:              # roles -> keys in models.yaml (decided by bake-off, ADR-001)
  resident: dictalm3_12b       # ADR-001: Hebrew prose + JSON stages
  investigator: gemma4_12b     # ADR-001: deep-search ReAct (tool calling)
  light: gemma4_e4b
  hebrew_editor: null
  heavy_investigator: null
  embed: arctic_embed2
  guard_l1: prompt_injection_deberta
  guard_l2: granite_guardian_2b

search:
  # migration step 1b (docs/PLAN_WINDOWS_NATIVE.md): SearXNG (Docker/Linux) goes away on native Windows.
  # provider: ddgs (pure-Python, default, no container needed) | searxng (legacy, requires the container).
  provider: ddgs
  ddgs:
    backends: [duckduckgo, bing, google, brave, yahoo]   # bing/yahoo only resolve for the *news* category in ddgs 9.x
    timeout_s: 15
    max_results: 10
  # Round 4 (2026-09-06 evening incident: 21 ddgs timeouts + 12 google captcha "sorry" pages cost
  # the weekly tender stage >1h). See docs/MODULES.md "Round 4 search" section.
  cache_ttl_hours: 24
  circuit_fail_threshold: 3
  circuit_base_cooldown_minutes: 1
  circuit_max_cooldown_minutes: 30
  max_queries_per_stage: 40

searxng:
  url: http://127.0.0.1:8088   # legacy SearXNG container (search.provider=ddgs is the default now)
  engines: [google, bing, "bing news", "google news"]   # verified 2026-09-04; ddg/brave/startpage get CAPTCHA-suspended
  engines_by_lang: { zh: [baidu, google], ru: [yandex, google], he: [google, "google news", bing] }
  rate_limit_per_minute: 20

fetch:
  timeout_seconds: 20
  max_bytes: 2_000_000
  user_agent: "eo-analyst/0.1 (+local OSINT research; contact: none)"
  respect_robots: true

security:
  quarantine_on_flag: true
  blocklist_after_incidents: 2
  hidden_text_min_ratio: 0.15
  max_base64_blob_chars: 200

report:
  language: he
  formats: [docx, md, html]
  output_dir: output/reports
  template: agent/eoa/report/templates/daily_rtl.docx
  citation_style: numbered      # [n] mapped to items.url
  require_citations: true       # QA blocks uncited claims

bd_report:   # A11: "דוח מיקוד לפיתוח עסקי, מכירה ושיווק לפי טריטוריה" (eoa.report.bd_territory)
  territories: [US, IL, EU, GB, IN, KR]   # weekly scheduler default set; on-demand accepts any territory
  lookback_days: 90
  # BD-1 (docs/qa/findings_Q3_r2.md): who "we" are, so recommended actions are always framed from
  # our own point of view and never recommend promoting a watchlist competitor. EDIT `name` before
  # relying on the BD report's recommended-actions section.
  our_company:
    name: "החברה שלנו (הגדר ב-config: bd_report.our_company)"
    aliases: []
    country: IL
    is_israeli_industry: true
  perspective_he: >
    כתוב את כל סעיף הפעולות המומלצות מנקודת המבט של החברה שלנו בלבד (ראו our_company): יזום פנייה
    לגורמים מזמינים/שותפים, מענה למכרזים/RFI, נוכחות שלנו בכנסים, ומעקב/התמודדות מול מתחרים. מתחרה
    ברשימת המעקב (watchlist) מוזכר תמיד ככזה — אסור בשום פנים ואופן להמליץ להציג, לקדם או לשווק את
    היכולות/המוצרים של מתחרה.

payloads:   # A17: מאגר מפרטי מטע"דים ומחירי ייחוס (eoa.payloads) -- append-only version history
  enabled: true       # gates the optional nightly `payload_extract` scheduler job
  nightly_limit: 20   # max candidate items scanned per nightly run

acquisition_watch:   # A16: מעקב רכישות ושותפויות (eoa.pipeline.acquisition / eoa.report.acquisition_watch)
  enabled: true       # gates the deterministic triage alert AND the weekly/BD "מעקב רכישות" section
  alert_level: red    # triage.levels key the deterministic acquisition-watch boost raises a matching item's score to

dossier:   # PD-backend: "סקירת שוק עמוקה למוצר" (eoa.dossier) -- on-demand, multi-round product deep dive
  rounds_per_topic: 3     # max_rounds per eoa.search.deep_search.investigate() call, one per research topic
  max_topics: 10           # research-plan topic cap (spec/versions/performance/maturity/platforms_and_programmes/deals/pricing/partnerships/competitors/regulatory)
  budget_multiplier: 1.0   # forwarded to investigate()'s own budget_multiplier for every topic call
  max_sources: 40          # citation-registry cap (existing DB records + deep-search sources combined)
  topic_time_cap_s: 600    # PD-fix item 6: hard per-topic wall-clock cap (seconds); investigate() stops with what it has

notify:
  url: http://127.0.0.1:8091      # native ntfy (ADR-004); NTFY_URL env overrides
  topic: eo-analyst
  public_fallback_url: https://ntfy.sh
  public_fallback_topic: dissertation_editor_ysf
  send_report_link: true
  send_red_alerts: true
  send_security_alerts: true
  clarification_timeout_min: 5
  mirror_to_public: true        # until the phone subscribes to the self-hosted server (Tailscale http://100.70.157.25:8091/eo-analyst)

retention:
  raw_text_days: 90
  logs_days: 30
  backups_keep: 30

api:
  host: 127.0.0.1
  port: 8765
  status_push_seconds: 2
  # ADR-008 (docs/adr/008-remote-access.md): passcode + session gate for any client reaching this
  # API from a non-loopback host (Tailscale, LAN). Disabled by default -- loopback callers are
  # unaffected either way. Set the passcode via `scripts\native\remote_access.ps1 -SetPasscode`
  # (writes EOA_ACCESS_PASSCODE into runtime\eoa.env, read once at process start and hashed in
  # memory -- never stored here in plaintext) rather than editing passcode_hash by hand.
  remote_access:
    enabled: true
    session_ttl_days: 30   # 2026-09-08: DB-persisted sessions (migration 0032); restarts no longer log the phone out
    passcode_hash: ""
    token_required_for_writes: true
    trusted_local_only: true

ask:   # R7-chat (docs/qa/loop/round_7_fixes.md): POST /api/ask chat-only settings -- never read by
       # the pipeline/report paths.
  entailment_check: true         # user decision 2026-09-07 06:50: ON. Light-model (Gemini Flash in cloud mode) entailment pass over cited key-fact claims;
                                  # unit tests force it off via tests/conftest.py (no network from tests);
  # R8-chat-b (docs/qa/loop/round_7_judge_b.md, docs/qa/loop/round_8_fixes.md "### R8-chat-b
  # status"): live-verified 2026-09-07 via runtime/logs/api.2026-09-07.log that all 5 of 5 sampled
  # real entailment attempts that day skipped on `reason=timeout_or_error` -- 0 successes, 0
  # removals ever observed. Root cause: the light-model call never passed `interactive=True`, so it
  # queued behind the resource gate's patient *batch* budget instead of the short interactive one
  # -- fixed in `agent/eoa/api/ask_grounding.py`'s `entailment_filter` (its own `_call` closure now
  # passes `interactive=True`), and that function's own wall-clock default is raised 20s -> 30s
  # (extra headroom once actually admitted) per this round's brief. The brief also asked to cap
  # claims to 4 -- left at 6 *here* on purpose: `tests/unit/test_ask_round7.py`'s
  # `TestAskConfig.test_default_config_values` asserts this value `== 6` and is a shared-suite test
  # package R8-chat-b does not own/may not edit, so the effective per-call cap of 4 is instead
  # enforced in `agent/eoa/api/routes/ask.py` (`_ENTAILMENT_MAX_CLAIMS_CAP`), independent of this
  # raw value -- change this number only alongside updating that pinned test in the same change.
  entailment_max_claims: 6       # cap on claims sent to the light model per answer (see note above: effective cap is 4, enforced in routes/ask.py, not here)

export:
  obsidian: { enabled: true, vault_dir: output/obsidian, entities: true, items: true, reports: true, min_level: yellow }

llm_providers:   # U8 / docs/adr/005-cloud-llm-cli.md + Revision 2026-09-06 — global local/cloud switch + fallback chains
  mode: cloud   # user decision 2026-09-06 16:20: cloud chain for analysis/reports, local fallback (docs/qa/loop/MODEL_DECISION.md)
  allow_cloud: true                 # kill switch: false disables every cloud provider everywhere, chat falls back to ollama
  auto_cloud_fallback: true  # Local unavailable/paused -> configured cloud providers, without releasing GPU pause.
  cloud_batch_size: 5  # Small batches validated in cloud completion 266.
  interactive_default: "agy:gemini-3.1-pro-high"
  timeout_s: 360   # bake-off: one claude analyze call exceeded 120 s on 11k chars; 2026-09-07 weekly/monthly report drafts (20-80k chars, power=high) exceeded 240 s twice each and fell back to agy
  cli_text_tools: true   # 2026-09-09: CLI legs (agy/claude/codex) accept a tool-calling turn via the text protocol (eoa.llm.providers.cli); false = tool-calling turns always run on the local ollama leg, as before this change
  cli:
    agy:
      binary: agy      # Gemini via Antigravity CLI (resolved through PATH; falls back to an absolute path if set)
      models: [gemini-3.8-flash-medium, gemini-3.8-flash-high, gemini-3.1-pro-high]  # ids from `agy models` (verified 2026-09-05)
    claude:
      binary: claude   # Claude Code CLI
      models: [claude-opus-5-5, claude-opus-5, claude-sonnet-5, claude-haiku-4-5-20251001]
    codex:
      binary: codex    # Codex CLI (read-only sandbox, exec mode)
      models: [default, gpt-6-astra]  # "default" = whatever ~/.codex/config.toml's model= is (verified live 2026-09-09: gpt-6-astra); gpt-6-astra also selectable explicitly via -m
  # U8-ו: direct-API providers. Keys come from .env ONLY (ANTHROPIC_API_KEY / GEMINI_API_KEY /
  # OPENAI_API_KEY) — never put a key here, never in the UI. Model lists below are the
  # "approximate, edit me" defaults asked for in point 5; Gemini's list refreshes live from
  # /v1beta/models when GEMINI_API_KEY is set.
  api:
    anthropic:
      models: [claude-opus-5, claude-sonnet-5, claude-haiku-4-5-20251001]
      power_levels: [low, medium, high]   # -> thinking.budget_tokens
    gemini:
      models: [gemini-3.1-pro-preview, gemini-3.5-flash, gemini-3.1-flash-lite]
      power_levels: [low, medium, high]   # -> thinkingConfig.thinkingBudget
    openai:
      models: [gpt-5.1, gpt-5.1-mini]
      power_levels: [low, medium, high]   # -> reasoning_effort
  # U8-ה: per-role ordered fallback chains, used only when mode: cloud. A role missing here (or
  # mode: local) resolves to a single-entry local chain. The last entry of ANY chain is always
  # forced to `ollama` even if omitted below (see Settings.llm_providers.effective_chain).
  # Example (commented out — the default ships with mode: local and no chains configured):
  # chains:
  #   resident:      [{provider: agy, model: gemini-3.8-flash-medium}, {provider: ollama}]
  #   investigator:  [{provider: claude, model: claude-sonnet-5, power: high}, {provider: agy, model: gemini-3.1-pro-high}, {provider: ollama}]
  #   light:         [{provider: agy, model: gemini-3.8-flash-medium}, {provider: ollama}]
  #   report:        [{provider: claude, model: claude-opus-5, power: high}, {provider: ollama}]
  # 2026-09-23 (user): claude-opus-5-5 is the intermediate leg before the local terminal entry in
  # every chain. On 2026-09-21 claude-sonnet-5 timed out and agy answered status=ERROR on the same
  # batch; with local inference paused nothing was left and analyze/deep_search deferred. Needs
  # Claude Code CLI >= 2.1.280 (2.1.251 rejected the id as unrecognized_model).
  chains:
    resident:
    - { provider: claude, model: claude-sonnet-5, power: medium }
    - { provider: agy, model: gemini-3.1-pro-high }
    - { provider: claude, model: claude-opus-5-5, power: medium }
    - provider: ollama
    investigator:
    - { provider: claude, model: claude-sonnet-5, power: high }
    - { provider: agy, model: gemini-3.1-pro-high }
    - { provider: claude, model: claude-opus-5-5, power: high }
    - provider: ollama
    light:   # 2026-09-06 18:40: local first is what froze tenders/chat while the user's own GPU job held VRAM; cheap flash first, local fallback
    - { provider: agy, model: gemini-3.8-flash-medium }
    - { provider: claude, model: claude-opus-5-5, power: low }
    - provider: ollama
    report:
    - { provider: claude, model: claude-sonnet-5, power: high }
    - { provider: agy, model: gemini-3.1-pro-high }
    - { provider: claude, model: claude-opus-5-5, power: high }
    - provider: ollama
  # U8-ו/5: USD per million tokens, "approximate, edit me". CLI providers (agy/claude/codex) are
  # intentionally absent — subscription-based, cost 0 even when usage is reported.
  pricing:
    "anthropic:claude-opus-5": { input_per_mtok: 15.0, output_per_mtok: 75.0 }
    "anthropic:claude-sonnet-5": { input_per_mtok: 3.0, output_per_mtok: 15.0 }
    "anthropic:claude-haiku-4-5-20251001": { input_per_mtok: 0.8, output_per_mtok: 4.0 }
    "gemini:gemini-3.1-pro-preview": { input_per_mtok: 1.25, output_per_mtok: 10.0 }
    "gemini:gemini-3.5-flash": { input_per_mtok: 0.3, output_per_mtok: 2.5 }
    "gemini:gemini-3.1-flash-lite": { input_per_mtok: 0.1, output_per_mtok: 0.4 }
    "openai:gpt-5.1": { input_per_mtok: 5.0, output_per_mtok: 15.0 }
    "openai:gpt-5.1-mini": { input_per_mtok: 0.5, output_per_mtok: 2.0 }
