[project]
name = "eo-analyst"
version = "0.1.0"
description = "Local, offline-first OSINT analyst agent for defense electro-optics and computer vision"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pgvector>=0.3",
    "apscheduler>=3.10,<4",
    "structlog>=24.1",
    "feedparser>=6.0",
    "trafilatura>=1.9",
    "python-dateutil>=2.9",
    "python-docx>=1.1",
    "lxml>=5.2",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "tenacity>=8.3",
    "langdetect>=1.0.9",
    "icalendar>=5.0",
    "charset-normalizer>=3.3",
]

[project.optional-dependencies]
guard = ["torch>=2.3", "transformers>=4.44", "onnxruntime>=1.18", "optimum>=1.21"]
# CPU-only path for the L1 prompt-injection classifier (Protect AI DeBERTa v2):
# no torch/CUDA wheel, just ONNX Runtime + optimum's ORTModel wrapper. This is
# what docker/agent/Dockerfile installs into the (internet-isolated at runtime)
# `agent` image; the model itself is baked into the image at build time under
# /opt/models/prompt-guard (see EOA_GUARD_L1_DIR in agent/eoa/security/guard.py).
guard-onnx = ["optimum[onnxruntime]>=1.21", "transformers>=4.44", "tokenizers", "onnxruntime>=1.18"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "testcontainers[postgres]>=4.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-python-dateutil",
    "respx>=0.21",
    "freezegun>=1.5",
]

[project.scripts]
eo = "eoa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent/eoa"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["agent", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "N818", "UP047", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["eoa"]
mypy_path = "agent"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["agent"]
asyncio_mode = "auto"
markers = [
    "integration: needs docker/postgres",
    "gpu: needs Ollama with GPU",
    "security: injection fixtures",
]
